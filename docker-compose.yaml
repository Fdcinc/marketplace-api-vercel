services:
  kong:
    image: kong:3.9.1
    container_name: marketplace-api-vercel-kong
    user: "root"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    volumes:
      - ./kong.yml:/tmp/kong.yml  # Mount to temp location
    ports:
      - "8000:8000"
      - "8001:8001"
      - "8002:8002"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always
    command: >
      sh -c "mkdir -p /usr/local/kong/declarative/ &&
             cp /tmp/kong.yml /usr/local/kong/declarative/kong.yml &&
             /docker-entrypoint.sh kong docker-start"