_format_version: "3.0"

services:
  - name: marketplace-api
    url: http://host.docker.internal:5000
    retries: 5
    connect_timeout: 60000
    write_timeout: 60000
    read_timeout: 60000
    routes:
      - name: auth-usage-route
        paths:
          - /api/v1/auth/usage
        strip_path: false
        methods: [GET, PUT, POST, PATCH, DELETE, OPTIONS, HEAD, CONNECT, TRACE]
        protocols: [http, https]
      
      - name: auth-register-route
        paths:
          - /api/v1/auth/register
        strip_path: false
        methods: [POST]
        protocols: [http, https]
      
      - name: auth-login-route
        paths:
          - /api/v1/auth/login
        strip_path: false
        methods: [POST]
        protocols: [http, https]

      - name: auth-me-route
        paths:
          - /api/v1/auth/me
        strip_path: false
        methods: [GET]
        protocols: [http, https]  
      
      - name: auth-logout-route
        paths:
          - /api/v1/auth/logout
        strip_path: false
        methods: [POST]
        protocols: [http, https]
    
    plugins:
      - name: request-transformer
        config:
          add:
            headers:
              - "x-platform-secret:my-marketplace-private-key-123"

consumers:
  - username: realtest
    custom_id: "1010"